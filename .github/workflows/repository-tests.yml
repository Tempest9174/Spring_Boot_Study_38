name: Repository tests

on:
  push:
    branches:
      - repository-tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run StudentRepository tests
        run: ./gradlew test --tests raisetech.student.management2.repository.StudentRepositoryTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-test-report
          path: build/reports/tests/test


spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # ここでログ出力を有効化。>AI手順説明で代替案

logging:
  level:
    org.mybatis: DEBUG     # MyBatis内部の動きを出す
    jdbc.sqlonly: DEBUG    # 実際のSQL（ライブラリによる）
